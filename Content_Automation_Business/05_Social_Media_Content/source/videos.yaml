- id: C-V27
  day: 27
  pillar: client-workflows
  concept: "How to report a delay"
  hook: "How to tell a client about a delay without a wall of apologies."
  script: |
    [VISUAL: a four-line delay message]
    How to tell a client about a delay without a wall of apologies.
    Four moves. State it: "Launch will move to Thursday the sixteenth."
    Explain it in one sentence. Give the new date.
    And offer a choice if there is one: "If the original date is essential, we can launch without the second payment option and add it the following week."
    Early, plain and with a plan. That's what keeps trust.
  on_screen: "State · Explain (1 line) · New date · Choice"
  cta: "Weekly update template: link in bio"
  link: /blog/weekly-client-update-template/
  caption: "Delays happen. Here's how to report one: state it, one line of why, the new date, and a choice if there is one. More in the weekly client update guide (link in bio)."
  tags: workflows

- id: C-V28
  day: 28
  pillar: ai-done-right
  concept: "Testimonial request that asks permission"
  hook: "The right way to ask for a testimonial, and the one thing never to do."
  script: |
    [VISUAL: a short email with three questions]
    The right way to ask for a testimonial.
    Make it easy with three optional questions. What was the situation before? What was it like working together? What changed afterwards?
    Say two or three sentences is plenty. Ask permission to publish it with their name, or anonymously if they'd rather.
    And promise to send them the final wording to approve.
    The one thing never to do: write it for them. Real words or none.
  on_screen: "3 optional questions · permission · approval"
  cta: "Testimonial prompt: link in bio"
  link: /blog/ai-prompts-for-client-emails/
  caption: "Ask for testimonials the right way: three optional questions, clear permission, client approves the final wording. Never write one for them. Prompt at the link in bio."
  tags: ai

- id: C-V29
  day: 29
  pillar: systems-sops
  concept: "Track four numbers"
  hook: "You don't need a dashboard. You need four numbers once a month."
  script: |
    [VISUAL: four numbers on a sticky note]
    You don't need a fancy dashboard. You need four numbers, once a month.
    Hours on admin, even a rough estimate. Overdue invoices, count and total.
    Average time to first reply on new inquiries. Proposals sent versus accepted.
    Watch them for two or three months and you'll know whether your system's working.
    That's better than any promise, including ours.
  on_screen: "Admin hours · Overdue · Reply time · Win rate"
  cta: "Weekly review guide: link in bio"
  link: /blog/weekly-admin-review/
  caption: "Four numbers, once a month: admin hours, overdue invoices, time to first reply, proposals sent vs accepted. Measure your system; don't take anyone's word for it. Link in bio."
  tags: systems

