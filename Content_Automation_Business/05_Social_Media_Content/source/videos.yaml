  hook: "Five things that should never go into an AI chat, even for client work."
  script: |
    [VISUAL: you to camera; list appears as you speak]
    Five things that should never go into an AI chat, even for client work.
    Passwords and access links. Bank or card details. Government ID numbers.
    Health, legal or HR details about real people. And anything a client marked confidential.
    [VISUAL: before/after text: "Sarah Chen, Harbor Dental" → "[CLIENT NAME]"]
    For everything else, swap names and details for placeholders before you paste.
    The AI can write a great email to "client name". You put the real name back before sending.
    Then check your assistant's data settings. The article shows where they are in ChatGPT, Claude and Gemini.
