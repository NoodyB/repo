- id: C-V10
  day: 10
  pillar: client-workflows
  concept: "Scope creep: offer a choice"
  hook: "Scope creep isn't a people problem. It's a visibility problem."
  script: |
    [VISUAL: a chat message "while you're in there, could you…"]
    Scope creep rarely looks like a big request. It looks like "while you're in there".
    The goal isn't to say no. It's to make the change visible and give an easy choice.
    Option one: add it now, with the price and the new date. Option two: keep the launch date and do it as a later phase.
    Then the key line: "I'll hold off on this piece until I hear back."
    Don't start extra work before they choose. It's very hard to charge for it later.
  on_screen: "Name it · Offer 2 options · Wait for a yes"
  cta: "4 scope creep templates: link in bio"
  link: /blog/scope-creep-email-templates/
  caption: "Scope creep is a visibility problem. Name the change, offer two options, wait for a yes. Four email templates (including the \"quick favor\") at the link in bio."
  tags: workflows

