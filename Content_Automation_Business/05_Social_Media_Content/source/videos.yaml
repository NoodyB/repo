- id: C-V03
  day: 3
  pillar: getting-paid
  concept: "The 5-stage payment reminder schedule"
  hook: "Chasing invoices feels personal because you haven't decided the schedule in advance."
  script: |
    [VISUAL: calendar graphic with 5 markers]
    Chasing invoices feels awkward because you're deciding what to do every time.
    Decide once. Five stages.
    A: three days before it's due, a friendly heads-up, because most late payments are the invoice sitting in the wrong inbox.
    B: on the due date, a short reminder.
    C: seven days late, ask if anything's holding it up.
    D: fourteen days, ask for a payment date in writing.
    E: thirty days, the final notice, stating only what's in your agreement.
    Same schedule for every client. It stops feeling personal.
  on_screen: "A −3 · B 0 · C +7 · D +14 · E +30"
  cta: "All 5 templates: link in bio"
  link: /blog/payment-reminder-schedule/
  caption: "Chasing invoices gets easier when the schedule is decided in advance. Five stages, five templates, from a friendly heads-up to a final notice. Link in bio."
  tags: paid

