  hook: "Don't automate your admin yet. Score it first."
  script: |
    [VISUAL: a simple table being filled in]
    Don't automate your admin yet. Score it first.
    List every recurring task. For each one: how often, how many minutes, how repeatable, how risky.
    [VISUAL: formula on screen]
    Priority equals times per month, times minutes, times repeatability, divided by risk.
    In our fictional example, a web designer found weekly client updates beat proposals for total time.
    The fix wasn't an automation. It was a template and an AI draft.
    Automate only what's frequent, rule-based, low-risk and already written down.
