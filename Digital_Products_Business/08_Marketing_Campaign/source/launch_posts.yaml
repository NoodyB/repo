  - id: P-E09
    day: 15
    platform: LinkedIn
    format: text
    title: "Reminder stages you can steal"
    product: desk
    text: |
      The payment reminder stages built into The Client Desk (and free to steal):

      A: 3 days before due: heads-up
      B: due date: reminder
      C: +7: "anything holding it up?"
      D: +14: ask for a payment date in writing
      E: +30: final notice (only consequences in your agreement)

      The spreadsheet works out which stage each invoice is at and whether you've sent it. You can change the timing in Settings.

      Templates for every stage are free on the blog: [link]

  - id: P-E10
    day: 17
    platform: Instagram
    format: carousel
    title: "The delay email, structured"
    product: prompts
    slides:
      - "How to tell a client it's late"
      - "1. The news first (new date)"
      - "2. One sentence of context"
      - "3. Your plan"
      - "4. Impact on later milestones"
      - "5. Anything they need to do"
      - "Own it where it's yours. No apology spiral."
    text: |
      The structure behind prompt DEL-02 in The Band of One Prompt Library.

  - id: P-E11
    day: 19
    platform: LinkedIn
    format: text
    title: "7 days to an admin system"
    product: playbook
    text: |
      A 7-day plan for an admin system (from the last chapter of The Solo Admin Playbook):

      Day 1: Admin audit → your top three tasks to fix
      Day 2: Privacy settings, business brief, voice profile
      Day 3: Onboarding checklist + welcome email
      Day 4: Weekly update template + meeting-summary prompt
      Day 5: Payment terms + reminder templates
      Day 6: Inquiry reply + proposal structure
      Day 7: First SOP + first weekly review

      One step a day. You can start today with just a spreadsheet and a free AI plan.

  - id: P-E12
    day: 22
    platform: Instagram
    format: carousel
    title: "Offboarding checklist"
    product: playbook
    slides:
      - "The offboarding checklist"
      - "Final deliverables + short handover doc"
      - "Access transferred or removed"
      - "Final invoice sent, payment confirmed"
      - "Thank-you email + how to get help later"
      - "Testimonial request (with permission)"
      - "90-day check-in date in your tracker"
    text: |
      How you finish decides whether they come back and refer you. Workflow 6 of The Solo Admin Playbook.

  - id: P-E13
    day: 24
    platform: LinkedIn
    format: text
    title: "Testimonials, honestly"
    product: prompts
    text: |
      Three rules for testimonials:

      1. Ask with specific, optional questions: situation before, working together, what changed.
      2. Get permission to publish (name or anonymous, their choice) and let them approve the final wording.
      3. Never write one for them, and never edit one in a way that changes its meaning.

      In the U.S., the FTC's Endorsement Guides require endorsements to reflect the honest opinions of the endorser.

      The request prompt (RET-02) is free in our starter kit: [link]

  - id: P-E14
    day: 26
    platform: Instagram
    format: carousel
    title: "The Weekly Review tab"
    product: desk
    slides:
      - "A weekly admin review you can measure"
      - "Agenda: 45 minutes, 5 blocks"
      - "Live: overdue invoices (count + total)"
      - "Live: reminders to send now"
      - "Live: client follow-ups due"
      - "Log: admin hours · reply time · proposals · improvement"
    text: |
      The Weekly Review tab in The Client Desk. Real numbers over a few weeks show whether your system works.

  - id: P-E15
    day: 28
    platform: LinkedIn
    format: text
    title: "Quarterly planning prompt"
    product: prompts
    text: |
      A quarterly planning prompt for a one-person business:

      "Facilitate a quarterly planning session. Last quarter: [RESULTS]. Capacity: [HOURS/WEEK]. Goals: [GOALS]. Ask me up to 5 clarifying questions first. Then propose: max 3 priorities, each with a measurable outcome, the first step and the weekly time it needs; what I should stop or pause; and a simple monthly checkpoint."

      Fewer priorities, finished, beat many half-done.

      (OPS-07, The Band of One Prompt Library.)

