educational:
  - id: P-E01
    day: 1
    platform: LinkedIn
    format: text
    title: "Why prompt packs disappoint"
    product: prompts
    text: |
      Why do big prompt packs disappoint?

      Because a one-line prompt can't know:
      → what you're asking it to do (objective)
      → when it applies (use case)
      → what you'll paste in (inputs)
      → what "good" looks like (output format)
      → what it must never do (guardrails)

      A useful prompt specifies all five. It's longer, but you use it again and again.

      I'm launching a 100-prompt library built this way next week. Here's one of them for free, the business brief builder: [link to starter kit]

  - id: P-E02
    day: 2
    platform: Instagram
    format: carousel
    title: "Anatomy of a prompt card"
    product: prompts
    slides:
      - "Anatomy of a useful AI prompt"
      - "OBJECTIVE: the job it does"
      - "WHEN TO USE: the moment in your week"
      - "INPUTS: exactly what to paste, as [PLACEHOLDERS]"
      - "PROMPT: with guardrails (no invented prices or dates)"
      - "OUTPUT: what you should get back"
      - "TIP + PAIRS WITH: getting more from it"
    text: |
      Every prompt in The Band of One Prompt Library follows this format. The library launches next week; 10 prompts are free in the starter kit now (link in bio).

  - id: P-E03
    day: 3
    platform: LinkedIn
    format: text
    title: "The one-screen admin check"
    product: desk
    text: |
      A solo business needs one screen that answers:

      1. Who needs a follow-up this week?
      2. Which invoices need a reminder, and which one?
      3. What's in the pipeline, by stage?
      4. How did this week go?

      You can build this in any spreadsheet with a few formulas (our free invoice tracker shows how).

      The Client Desk, launching next week, has it built and tested: a Dashboard tab calculated from your client, project and invoice tabs. It works in Excel and Google Sheets, with no macros.

  - id: P-E04
    day: 4
    platform: Instagram
    format: carousel
    title: "The admin audit in 5 steps"
    product: playbook
    slides:
      - "Find where your admin time goes (5 steps)"
      - "1. List every recurring task from last month"
      - "2. Times/month × minutes each"
      - "3. Repeatability 1–3 (3 = identical each time)"
      - "4. Risk 1–3 (3 = legal, sensitive, relationship-critical)"
      - "5. Priority = (times × minutes) × repeat ÷ risk"
      - "Fix the top one this week. Only that one."
    text: |
      This is Chapter 2 of The Solo Admin Playbook. You can do it on paper today for free.

  - id: P-E05
    day: 6
    platform: LinkedIn
    format: text
    title: "Five decisions for every admin task"
    product: playbook
    text: |
      Every recurring admin task gets one of five decisions:

      ELIMINATE: nobody would notice if you stopped
      TEMPLATE: it's nearly identical every time
      AI DRAFT: the structure repeats, the content changes
      AUTOMATE: rule-based, frequent, low-risk and already templated
      KEEP HUMAN: high risk, high judgment or relationship-critical

      Notice automation comes after templating. If you can't write it as a checklist, you're not ready to automate it.

      (From The Solo Admin Playbook, Chapter 2.)

  - id: P-E06
    day: 9
    platform: Instagram
    format: carousel
    title: "What AI is good and bad at (client work)"
    product: playbook
    slides:
      - "AI for client admin: good at vs bad at"
      - "GOOD: first drafts from your notes"
      - "GOOD: summaries and structure"
      - "BAD: facts, prices, dates, promises"
      - "RISKY: anything confidential or personal"
      - "The rule: AI drafts, you decide"
    text: |
      From Chapter 3 of The Solo Admin Playbook: using AI safely with client work.

  - id: P-E07
    day: 11
    platform: LinkedIn
    format: text
    title: "Prompt: responding to a discount request"
    product: prompts
    text: |
      "Can you do it cheaper?"

      A prompt for replying without an apology spiral:

      "A client asked for a lower price: [REQUEST]. Draft a reply that acknowledges their budget, restates the value tied to their goals, and offers these options only: [MY OPTIONS]. If I've chosen not to reduce the price, say so kindly and clearly. Under 150 words, confident, no apology spiral, in my voice [VOICE PROFILE]."

      You decide the options (smaller scope? phased start?). The AI only handles the wording.

      (HARD-01, from the Tough Conversations section of The Band of One Prompt Library.)

  - id: P-E08
    day: 13
    platform: Instagram
    format: carousel
    title: "One system, three tools"
    product: bundle
    slides:
